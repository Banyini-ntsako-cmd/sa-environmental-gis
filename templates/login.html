<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - SA Environmental GIS</title>
  <style>
    body { background: #1e1e2e; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
    .login-card { background: #252538; padding: 30px; border-radius: 8px; width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #444; background: #2a2a3c; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>Practitioner Portal Login</h2>
    <p style="font-size: 12px; color: #aaa;">Authorized Environmental Personnel Only</p>
    <form method="POST" action="/login">
      <input type="email" name="email" placeholder="Email (practitioner@enviro.co.za)" required>
      <input type="password" name="password" placeholder="Password (securepass123)" required>
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
